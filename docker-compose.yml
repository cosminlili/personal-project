version: '3.9'

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand({ ping: 1 }).ok']
      interval: 10s
      timeout: 5s
      retries: 5

  authentication:
    build:
      context: .
      dockerfile: apps/authentication/Dockerfile
    environment:
      - AUTH_TCP_HOST=0.0.0.0
      - AUTH_TCP_PORT=4001
      - MONGO_URI=mongodb://mongodb:27017/auth
      - JWT_SECRET=SCtui9fcCaqmziuQf1SkFJ3fI8fdH3dNzusSEIVTKIA=
      - JWT_EXPIRES_IN=1h
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('net').createConnection({host:'127.0.0.1',port:4001}).on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    environment:
      - GATEWAY_PORT=3000
      - AUTH_TCP_HOST=authentication
      - AUTH_TCP_PORT=4001
      - CACHE_TTL_SECONDS=20
      - MONGO_URI=mongodb://mongodb:27017/auth
      - JWT_SECRET=SCtui9fcCaqmziuQf1SkFJ3fI8fdH3dNzusSEIVTKIA=
      - JWT_EXPIRES_IN=1h
    ports:
      - '3000:3000'
    depends_on:
      authentication:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health/live']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
